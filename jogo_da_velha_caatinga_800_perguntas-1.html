function startGame(){board=Array(9).fill("");gameOver=false;waiting=false;document.getElementById("setup").style.display="none";document.getElementById("game").style.display="block";document.getElementById("questionBox").style.display="none";document.getElementById("historyBox").style.display="none";document.getElementById("chosen").innerHTML=`Perguntas: <b>${label(qLevel)}</b> · Robô: <b>${label(botLevel)}</b>`;render();status("Sua vez! Toque em uma casa.")}
function backSetup(){document.getElementById("game").style.display="none";document.getElementById("setup").style.display="block"}
function status(t){document.getElementById("status").textContent=t}
function render(){let b=document.getElementById("board");b.innerHTML="";board.forEach((v,i)=>{let x=document.createElement("button");x.className="cell";x.textContent=v;x.disabled=!!v||gameOver||waiting;x.onclick=()=>player(i);b.appendChild(x)})}
function win(p){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(a=>a.every(i=>board[i]===p))}
function empty(){return board.map((v,i)=>v?null:i).filter(i=>i!==null)}
function winning(p){for(let i of empty()){board[i]=p;let w=win(p);board[i]="";if(w)return i}return -1}
function player(i){if(gameOver||waiting)return;board[i]="X";if(win("X")){stats[qLevel].playerWins++;finish("🎉 Você ganhou! Não precisa responder.");return}if(!empty().length){stats[qLevel].draws++;finish("🤝 Empate!");return}render();status("Minha vez...");setTimeout(bot,350)}
function bot(){let e=empty(),m=-1;if(botLevel==="facil")m=e[Math.floor(Math.random()*e.length)];else{m=winning("O");if(m<0)m=winning("X");if(m<0&&board[4]==="")m=4;if(m<0)m=e[Math.floor(Math.random()*e.length)]}board[m]="O";if(win("O")){stats[qLevel].botWins++;finish("🤖 Eu ganhei! Agora você responde uma pergunta.");ask();return}if(!empty().length){stats[qLevel].draws++;finish("🤝 Empate!");return}render();status("Sua vez!")}
function finish(t){gameOver=true;render();status(t)}
function ask(){waiting=true;render();if(used.length>=200){history();return}let avail=banks[qLevel].map((q,i)=>i).filter(i=>!used.includes(i));let idx=avail[Math.floor(Math.random()*avail.length)];used.push(idx);let q=banks[qLevel][idx];document.getElementById("question").textContent=q[0];let o=document.getElementById("options");o.innerHTML="";q.slice(1,5).forEach((v,i)=>{let b=document.createElement("button");b.className="option";b.textContent=String.fromCharCode(65+i)+") "+v;b.onclick=()=>answer(String.fromCharCode(65+i)===q[5]);o.appendChild(b)});document.getElementById("questionBox").style.display="block"}
function answer(ok){if(ok)stats[qLevel].correct++;else stats[qLevel].wrong++;document.getElementById("question").textContent=ok?"✅ Correto!":"❌ Errado!";document.getElementById("options").innerHTML='<button class="primary" onclick="next()">Continuar</button>'}
function next(){document.getElementById("questionBox").style.display="none";waiting=false;if(used.length>=200)history();else{status("A partida terminou. Inicie uma nova partida.");render()}}
function history(){document.getElementById("questionBox").style.display="none";document.getElementById("historyBox").style.display="block";let s=stats[qLevel],tot=s.correct+s.wrong,p=tot?Math.round(s.correct/tot*100):0;document.getElementById("history").innerHTML=`<p>❓ Perguntas: <b>${tot} / 200</b></p><p>✅ Acertos: <b>${s.correct}</b></p><p>❌ Erros: <b>${s.wrong}</b></p><p>🏆 Você ganhou: <b>${s.playerWins}</b> vezes</p><p>🤖 Eu ganhei: <b>${s.botWins}</b> vezes</p><p>🤝 Empates: <b>${s.draws}</b></p><p>📊 Aproveitamento: <b>${p}%</b></p>`}
</script></body></html>
